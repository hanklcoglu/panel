<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<title>Teacher Panel</title>
<style>
:root{
  --bg:#0f0f16; --card:#1a1a24; --card2:#22222f; --line:#2e2e42;
  --txt:#eef0f7; --dim:#9295b0; --accent:#7c5cff; --accent2:#a78bfa;
  --ok:#34d399; --bad:#fb7185; --gold:#fbbf24; --tr:#2eb872;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px}
#app{max-width:1080px;margin:0 auto;padding:22px 20px 60px}
h1{font-size:20px;margin:0;letter-spacing:-.3px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--accent2);margin:26px 0 10px}
button{font:inherit;border:none;cursor:pointer;color:inherit;border-radius:11px}
.btn{background:var(--accent);color:#fff;font-weight:650;padding:11px 18px}
.btn:hover{filter:brightness(1.1)} .btn:disabled{opacity:.5;cursor:default}
.btn.sec{background:var(--card2)} .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--dim)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}
.tabs{display:flex;gap:8px;margin-bottom:20px}
.tab{padding:10px 18px;border-radius:12px;background:var(--card);border:1px solid var(--line);
  color:var(--dim);font-weight:600}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tab.on.tr{background:var(--tr);border-color:var(--tr)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
textarea{width:100%;min-height:130px;padding:12px;border-radius:11px;background:var(--card2);
  border:1px solid var(--line);color:var(--txt);font:13px/1.6 ui-monospace,Menlo,monospace;
  outline:none;resize:vertical}
textarea:focus{border-color:var(--accent)}
input[type=text],input[type=password]{width:100%;padding:11px;border-radius:11px;background:var(--card2);
  border:1px solid var(--line);color:var(--txt);font:inherit;outline:none}
.note{font-size:12.5px;color:var(--dim);line-height:1.6;margin:8px 0}
code{background:var(--card2);padding:1px 5px;border-radius:5px;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--card2);border-radius:12px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:21px} .stat span{font-size:10.5px;color:var(--dim)}
.row{display:flex;align-items:center;gap:10px;padding:9px 11px;background:var(--card2);
  border-radius:10px;margin-bottom:6px}
.row .w{font-weight:650} .row .t{font-size:12.5px;color:var(--dim)}
.row .sp{margin-left:auto;display:flex;gap:6px;align-items:center}
.dots{display:flex;gap:3px}.dot{width:7px;height:7px;border-radius:9px;background:var(--line)}.dot.on{background:var(--ok)}

.passage{background:var(--card2);border-radius:11px;padding:13px;font-size:13.5px;line-height:1.7;
  white-space:pre-wrap;margin-bottom:10px;color:var(--txt)}
.qb{background:var(--card2);border-radius:11px;padding:11px 13px;margin-bottom:8px;border-left:3px solid var(--line)}
.qb.wrong{border-left-color:var(--bad)}
.qhead{font-weight:650;font-size:13.5px;margin-bottom:7px;line-height:1.5}
.ans{font-size:13px;margin-top:3px}
.ans .lbl{display:inline-block;min-width:78px;color:var(--dim);font-size:11.5px}
.msg{padding:10px 13px;border-radius:10px;margin:10px 0;font-size:13.5px;display:none}
.msg.ok{background:rgba(52,211,153,.13);color:var(--ok);display:block}
.msg.err{background:rgba(251,113,133,.13);color:var(--bad);display:block}
.msg.busy{background:var(--card2);color:var(--dim);display:block}
.pill{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--card);color:var(--dim);border:1px solid var(--line)}
.empty{color:var(--dim);font-size:13px;padding:10px 2px}
.setup{max-width:440px;margin:80px auto;text-align:center}
.hide{display:none!important}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);
  border-top-color:var(--accent2);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------------- config ---------------- */
const API = 'https://script.google.com/macros/s/AKfycbzqihr2OdBdbFS4eRVl0dhsO-9Mo7UCjFnEFuT-rei-X3ViFmr42rJ2c9iQ5jMLGmYkMw/exec';
const STUDENTS = [
  { id:'english', label:'English student', app:'https://hanklcoglu.github.io/kelime/',  meaning:'Turkish', cls:'' },
  { id:'arseniy', label:'Arseniy · Türkçe', app:'https://hanklcoglu.github.io/turkce/', meaning:'English', cls:'tr' }
];
const KEYSTORE = 'panel_key';

let KEY   = localStorage.getItem(KEYSTORE) || '';
let cur   = STUDENTS[0].id;
let STATE = { progress:[], assignments:[] };

/* ---------------- api ---------------- */
function safeJSON(t){
  try{ return JSON.parse(t); }
  catch(e){ return {ok:false, error:'Google sent back an error page instead of data. This happens occasionally \u2014 press the button again.'}; }
}
async function post(payload){
  try{
    const r = await fetch(API,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(Object.assign({key:KEY}, payload))
    });
    return safeJSON(await r.text());
  }catch(e){ return {ok:false, error:'Network error: '+e.message}; }
}
async function get(qs){
  try{
    const r = await fetch(API+'?key='+encodeURIComponent(KEY)+'&'+qs);
    return safeJSON(await r.text());
  }catch(e){ return {ok:false, error:'Network error: '+e.message}; }
}

/* ---------------- helpers ---------------- */
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = id => document.getElementById(id);

function say(kind, text){
  const m = $('msg');
  if(!m) return;
  m.className = 'msg ' + kind;
  m.innerHTML = (kind==='busy' ? '<span class="spin"></span> ' : '') + text;
  if(kind==='ok') setTimeout(()=>{ if(m.className==='msg ok') m.className='msg'; }, 4000);
}

function parseLines(txt){
  return txt.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    const p = l.split('|').map(x=>x.trim());
    if(p.length < 2) return null;
    let ex = p[2] || '';
    if(ex && ex.indexOf('___') === -1){
      const re = new RegExp('\\b'+p[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');
      if(re.test(ex)) ex = ex.replace(re,'___');
    }
    return { type:'word', w:p[0], tr:p[1], ex:ex, exTr:p[3] || '' };
  }).filter(Boolean);
}

function ago(iso){
  if(!iso) return 'never';
  const d = (Date.now() - new Date(iso).getTime())/864e5;
  if(d < 1) return 'today';
  if(d < 2) return 'yesterday';
  return Math.floor(d) + ' days ago';
}

/* ---------------- setup screen ---------------- */
function setupScreen(){
  $('app').innerHTML = `
  <div class="setup">
    <h1>🎓 Teacher Panel</h1>
    <p class="note" style="margin:16px 0">Enter your backend secret. It is stored only in this browser and never appears in the page source.</p>
    <input type="password" id="k" placeholder="secret" autocomplete="off">
    <div style="height:12px"></div>
    <button class="btn" style="width:100%" onclick="saveKey()">Unlock</button>
    <div id="msg" class="msg"></div>
  </div>`;
  $('k').addEventListener('keydown', e=>{ if(e.key==='Enter') saveKey(); });
  $('k').focus();
}
async function saveKey(){
  const v = $('k').value.trim();
  if(!v) return;
  KEY = v;
  say('busy','Checking…');
  const r = await get('action=ping');
  if(!r.ok){ say('err', r.error==='unauthorized' ? 'That secret was rejected.' : (r.error||'Could not reach the backend.')); return; }
  localStorage.setItem(KEYSTORE, v);
  boot();
}
function forgetKey(){
  if(!confirm('Forget the secret on this device?')) return;
  localStorage.removeItem(KEYSTORE); KEY=''; setupScreen();
}

/* ---------------- main ---------------- */
async function boot(){
  shell();
  await refresh();
}

function shell(){
  $('app').innerHTML = `
  <div class="top">
    <h1>🎓 Teacher Panel</h1>
    <div style="display:flex;gap:8px">
      <button class="btn sec sm" onclick="refresh()">↻ Refresh</button>
      <button class="btn ghost sm" onclick="forgetKey()">Lock</button>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="msg" class="msg"></div>
  <div id="body"></div>`;
  tabs();
}

function tabs(){
  $('tabs').innerHTML = STUDENTS.map(s=>
    `<button class="tab ${s.id===cur?'on '+s.cls:''}" onclick="pick('${s.id}')">${esc(s.label)}</button>`
  ).join('');
}
function pick(id){ cur = id; tabs(); render(); }

async function refresh(){
  say('busy','Loading from Google Sheet…');
  const r = await get('action=state');
  if(!r.ok){ say('err', r.error || 'Failed'); return; }
  STATE = r;
  say('ok','Up to date');
  render();
}

/* ---------------- render ---------------- */
function render(){
  const s  = STUDENTS.find(x=>x.id===cur);
  const pr = STATE.progress.find(p=>String(p.student)===cur);
  const mine = STATE.assignments.filter(a=>String(a.student)===cur && a.type!=='task');
  const words = mine.filter(a=>a.type!=='note');
  const notes = mine.filter(a=>a.type==='note');

  $('body').innerHTML = `
  <div class="grid">
    <div>
      <h2>Assign words</h2>
      <div class="card">
        <div class="note">One per line —
          <code>word | ${esc(s.meaning)} | example sentence | translation</code><br>
          Use <code>___</code> for the gap, or leave it out and I'll insert it.</div>
        <textarea id="wIn" placeholder="until | -e kadar | I waited ___ six o'clock. | Saat altıya kadar bekledim."></textarea>
        <div style="height:10px"></div>
        <button class="btn" onclick="sendWords()">Send to ${esc(s.label)}</button>
      </div>

      <h2>Grammar note</h2>
      <div class="card">
        <div class="note">Short reference text they can read in the app.</div>
        <textarea id="nIn" style="min-height:90px" placeholder="Dative (-e) verbs: güvenmek, inanmak, alışmak, katılmak…"></textarea>
        <div style="height:10px"></div>
        <button class="btn sec" onclick="sendNote()">Send note</button>
      </div>
    </div>

    <div>
      <h2>Progress</h2>
      <div class="card">
        ${pr ? `
          <div class="stats">
            <div class="stat"><b>${pr.streak||0}</b><span>day streak</span></div>
            <div class="stat"><b>${pr.xp||0}</b><span>XP</span></div>
            <div class="stat"><b>${pr.learned||0}</b><span>learned</span></div>
            <div class="stat"><b>${pr.deck||0}</b><span>words</span></div>
          </div>
          <div class="note">Last practised: <b style="color:var(--txt)">${ago(pr.updatedAt)}</b></div>
          ${weakest(pr)}
        ` : `<div class="empty">No data yet. It appears the first time they open the app after you send them their link.</div>`}
      </div>
    </div>
  </div>

  ${tasksSection()}

  <h2>Assigned so far — ${words.length} words${notes.length?', '+notes.length+' notes':''}</h2>
  <div class="card">
    ${ mine.length ? mine.map(a=>rowHTML(a)).join('') : '<div class="empty">Nothing assigned yet. The starter deck is built into their app.</div>' }
  </div>`;
}

function weakest(pr){
  const p = pr.payload || {};
  const words = p.words || {};
  const deck  = p.deck  || [];
  if(!deck.length) return '';
  const rows = deck.map(d=>{
    const st = words[d.w] || {};
    return { w:d.w, tr:d.tr, box:st.box||0, seen:st.seen||0, wrong:st.wrong||0 };
  }).filter(r=>r.seen>0).sort((a,b)=>a.box-b.box || b.wrong-a.wrong).slice(0,12);
  if(!rows.length) return '<div class="empty">No words practised yet.</div>';
  return `<div style="margin-top:12px"><div class="note">Weakest — review these in the lesson</div>${
    rows.map(r=>`<div class="row"><div><div class="w">${esc(r.w)}</div>
      <div class="t">${esc(r.tr)} · ${r.wrong} wrong / ${r.seen} tries</div></div>
      <div class="sp"><div class="dots">${[1,2,3,4,5].map(i=>`<div class="dot ${r.box>=i?'on':''}"></div>`).join('')}</div></div></div>`).join('')
  }</div>`;
}

function rowHTML(a){
  if(a.type === 'note'){
    return `<div class="row"><div style="flex:1">
      <div class="w">📘 Grammar note</div>
      <div class="t">${esc(String(a.note).slice(0,110))}</div></div>
      <div class="sp"><button class="btn ghost sm" onclick="del('${a.id}')">Delete</button></div></div>`;
  }
  return `<div class="row"><div style="flex:1">
    <div class="w">${esc(a.w)} <span class="pill">${esc(a.tr)}</span></div>
    <div class="t">${esc(a.ex||'—')}</div></div>
    <div class="sp">
      <button class="btn sec sm" onclick="edit('${a.id}')">Edit</button>
      <button class="btn ghost sm" onclick="del('${a.id}')">Delete</button>
    </div></div>`;
}

/* ================= assignments: shared parser + scoring ================= */
/* Markup:
     TEXT ... END          reading passage
     Q question            multiple choice; options on following lines
       - wrong             (- wrong, * correct)
       * right
     GAP sentence with ___ | answer            typed answer, / separates alternatives
     WRITE prompt                              free writing, not auto-scored
   Blank lines are ignored outside TEXT blocks.                                */

function parseTask(body){
  const lines = String(body||'').replace(/\r/g,'').split('\n');
  const items = [];
  let i = 0, n = 0;
  while(i < lines.length){
    const raw = lines[i], line = raw.trim();

    if(/^TEXT\b/i.test(line)){
      const buf = [];
      i++;
      while(i < lines.length && !/^END\b/i.test(lines[i].trim())){ buf.push(lines[i]); i++; }
      i++;
      items.push({ kind:'text', body: buf.join('\n').trim() });
      continue;
    }

    if(/^Q\s+/i.test(line)){
      const q = { kind:'mc', id:'q'+(++n), q: line.replace(/^Q\s+/i,'').trim(), opts:[], answer:-1 };
      i++;
      while(i < lines.length){
        const o = lines[i].trim();
        if(/^[-*]\s+/.test(o)){
          if(o.charAt(0) === '*') q.answer = q.opts.length;
          q.opts.push(o.replace(/^[-*]\s+/,'').trim());
          i++;
        } else break;
      }
      items.push(q);
      continue;
    }

    if(/^GAP!\s+/i.test(line)){
      const rest = line.replace(/^GAP!\s+/i,'');
      const bar = rest.lastIndexOf('|');
      const sentence = (bar > -1 ? rest.slice(0,bar) : rest).trim();
      const answers = (bar > -1 ? rest.slice(bar+1) : '').split('/').map(s=>s.trim()).filter(Boolean);
      items.push({ kind:'gap', id:'q'+(++n), q: sentence, answers: answers, strict: true });
      i++;
      continue;
    }

    if(/^GAP\s+/i.test(line)){
      const rest = line.replace(/^GAP\s+/i,'');
      const bar = rest.lastIndexOf('|');
      const sentence = (bar > -1 ? rest.slice(0,bar) : rest).trim();
      const answers = (bar > -1 ? rest.slice(bar+1) : '').split('/').map(s=>s.trim()).filter(Boolean);
      items.push({ kind:'gap', id:'q'+(++n), q: sentence, answers: answers });
      i++;
      continue;
    }

    if(/^WRITE\s+/i.test(line)){
      items.push({ kind:'write', id:'q'+(++n), q: line.replace(/^WRITE\s+/i,'').trim() });
      i++;
      continue;
    }

    i++;
  }
  return items;
}

function taskQuestions(items){
  return items.filter(function(it){ return it.kind !== 'text'; });
}
function taskAutoMax(items){
  return items.filter(function(it){ return it.kind === 'mc' || it.kind === 'gap'; }).length;
}

/* Grades one answer. Returns true / false / null (null = needs a human). */
function gradeItem(it, ans){
  if(it.kind === 'mc'){
    if(ans === undefined || ans === null || ans === '') return false;
    return Number(ans) === Number(it.answer);
  }
  if(it.kind === 'gap'){
    if(!ans) return false;
    if(!it.answers || !it.answers.length) return null;
    if(it.strict){
      const tidy = function(s){ return String(s||'').trim().replace(/\s+/g,' '); };
      return it.answers.some(function(a){ return tidy(ans) === tidy(a); });
    }
    return it.answers.some(function(a){ return checkTyped(ans, a) !== 'no'; });
  }
  return null;
}

function scoreTask(items, answers){
  let score = 0, max = 0;
  taskQuestions(items).forEach(function(it){
    const g = gradeItem(it, answers ? answers[it.id] : undefined);
    if(g === null) return;
    max++;
    if(g) score++;
  });
  return { score: score, max: max };
}


/* ---------------- assignments ---------------- */
const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/\u0131/g,'i').trim().replace(/[.,!?;:"']/g,'').replace(/\s+/g,' ');
function lev(a,b){const m=[];for(let i=0;i<=b.length;i++)m[i]=[i];for(let j=0;j<=a.length;j++)m[0][j]=j;
  for(let i=1;i<=b.length;i++)for(let j=1;j<=a.length;j++)
    m[i][j]=b[i-1]===a[j-1]?m[i-1][j-1]:Math.min(m[i-1][j-1]+1,m[i][j-1]+1,m[i-1][j]+1);
  return m[b.length][a.length];}
function checkTyped(u,t){const a=norm(u),b=norm(t);if(!a)return 'no';if(a===b)return 'yes';
  return lev(a,b)<=(b.length>6?2:1)?'close':'no';}

function dueYMD(due){
  if(!due) return null;
  const t = String(due);
  const plain = t.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(plain) return [ +plain[1], +plain[2]-1, +plain[3] ];
  const d = new Date(t);
  if(isNaN(d.getTime())) return null;
  return [ d.getFullYear(), d.getMonth(), d.getDate() ];
}
function dueLabel(due){
  const p = dueYMD(due);
  if(!p) return '';
  return p[0]+'-'+String(p[1]+1).padStart(2,'0')+'-'+String(p[2]).padStart(2,'0');
}

let openTaskId = null;

function myTasks(){ return STATE.assignments.filter(a => a.type==='task' && String(a.student)===cur); }
function submissionsFor(student){
  const p = STATE.progress.find(x => String(x.student)===student);
  return (p && p.payload && p.payload.tasks) || {};
}

function tasksSection(){
  const tasks = myTasks(), subs = submissionsFor(cur);
  if(openTaskId){
    const t = tasks.find(x => String(x.id)===String(openTaskId));
    if(t) return taskDetail(t, subs[t.id]);
    openTaskId = null;
  }
  return `
  <h2>Assignments</h2>
  <div class="card">
    <div style="display:flex;gap:10px;margin-bottom:10px">
      <input type="text" id="tTitle" placeholder="Title, e.g. Reading: a day at the market" style="flex:2">
      <input type="date" id="tDue" style="flex:1">
    </div>
    <textarea id="tBody" style="min-height:190px" placeholder="TEXT
Ali went to the market yesterday. He bought bread and cheese.
END

Q What did Ali buy?
- meat
* bread and cheese
- nothing

GAP I ___ to school yesterday. | went

WRITE Describe your weekend in five sentences."></textarea>
    <div class="note"><b style="color:var(--txt)">Format</b> &nbsp;
      <code>TEXT</code> … <code>END</code> a passage &nbsp;·&nbsp;
      <code>Q</code> question, then options as <code>-</code> wrong and <code>*</code> correct &nbsp;·&nbsp;
      <code>GAP</code> sentence with <code>___</code> then <code>|</code> answer (use <code>/</code> for alternatives) &nbsp;·&nbsp;
      <code>GAP!</code> same, but marked <b style="color:var(--txt)">exactly</b> — accents and case count &nbsp;·&nbsp;
      <code>WRITE</code> a prompt you'll read yourself.</div>
    <div style="display:flex;gap:8px">
      <button class="btn" onclick="sendTask()">Send assignment</button>
      <button class="btn sec" onclick="previewTask()">Preview</button>
    </div>
    <div id="tPrev"></div>
  </div>

  <h2>Sent — ${tasks.length}</h2>
  <div class="card">
    ${tasks.length ? tasks.map(t=>{
      const sub = subs[t.id];
      const st = sub && sub.submittedAt
        ? `<span style="color:var(--ok);font-weight:650">${sub.score}/${sub.max}</span>`
        : `<span style="color:var(--dim)">not submitted</span>`;
      return `<div class="row"><div style="flex:1">
        <div class="w">${esc(t.w||'Assignment')}</div>
        <div class="t">${dueLabel(t.tr)?('due '+esc(dueLabel(t.tr))+' · '):''}${taskQuestions(parseTask(t.note||'')).length} questions</div>
      </div><div class="sp">${st}
        <button class="btn sec sm" onclick="openTaskId='${t.id}';render()">Open</button>
        <button class="btn ghost sm" onclick="del('${t.id}')">Delete</button>
      </div></div>`;
    }).join('') : '<div class="empty">Nothing sent yet.</div>'}
  </div>`;
}

function taskDetail(t, sub){
  const items = parseTask(t.note||'');
  let qi = 0;
  const rows = items.map(function(it){
    if(it.kind==='text') return `<div class="passage">${esc(it.body)}</div>`;
    qi++;
    const a = sub && sub.answers ? sub.answers[it.id] : undefined;
    const g = gradeItem(it, a);
    const badge = g===true ? '<span style="color:var(--ok)">correct</span>'
               : g===false ? '<span style="color:var(--bad)">wrong</span>'
               : '<span style="color:var(--gold)">for you to read</span>';
    let shown = '—', want = '';
    if(it.kind==='mc'){
      shown = (a===undefined||a===null||a==='') ? '—' : esc(it.opts[Number(a)] || String(a));
      want = esc(it.opts[it.answer]||'');
    } else if(it.kind==='gap'){
      shown = a ? esc(a) : '—';
      want = esc((it.answers||[]).join(' / '));
    } else {
      shown = a ? esc(a) : '—';
    }
    return `<div class="qb${g===false?' wrong':''}">
      <div class="qhead">${qi}. ${esc(it.kind==='gap' ? it.q : it.q)} &nbsp;${badge}</div>
      <div class="ans"><span class="lbl">answered</span>${shown}</div>
      ${want ? `<div class="ans"><span class="lbl">expected</span>${want}</div>` : ''}
    </div>`;
  }).join('');

  return `
  <h2><button class="btn ghost sm" onclick="openTaskId=null;render()">← back</button>
    &nbsp; ${esc(t.w||'Assignment')}</h2>
  <div class="card">
    ${sub && sub.submittedAt
      ? `<div class="stats"><div class="stat"><b>${sub.score}/${sub.max}</b><span>auto-checked</span></div>
         <div class="stat"><b>${taskQuestions(items).length}</b><span>questions</span></div>
         <div class="stat"><b>${ago(sub.submittedAt)}</b><span>submitted</span></div></div>`
      : '<div class="empty">Not submitted yet.</div>'}
    ${rows}
  </div>`;
}

function previewTask(){
  const items = parseTask($('tBody').value);
  const qn = taskQuestions(items).length, auto = taskAutoMax(items);
  const bad = items.filter(i=>i.kind==='mc' && i.answer<0).length;
  $('tPrev').innerHTML = `<div class="note" style="margin-top:12px">
    ${items.filter(i=>i.kind==='text').length} passage(s) · ${qn} questions · ${auto} auto-checked
    ${bad ? `<br><span style="color:var(--bad)">${bad} multiple-choice question(s) have no <code>*</code> marking the correct option.</span>` : ''}
    ${qn===0 ? '<br><span style="color:var(--bad)">No questions found — check the format.</span>' : ''}
  </div>`;
}

async function sendTask(){
  const title = $('tTitle').value.trim();
  const due = $('tDue').value;
  const body = $('tBody').value;
  const items = parseTask(body);
  if(!title){ say('err','Give the assignment a title.'); return; }
  if(!taskQuestions(items).length){ say('err','No questions found. Check the format.'); return; }
  const bad = items.filter(i=>i.kind==='mc' && i.answer<0).length;
  if(bad && !confirm(bad+' multiple-choice question(s) have no * on the correct option. They cannot be auto-checked. Send anyway?')) return;
  say('busy','Sending assignment…');
  const r = await post({action:'assign', student:cur, items:[{type:'task', w:title, tr:due, note:body}]});
  if(!r.ok){ say('err', (r.error||'Failed')+' — check the Sent list below before resending; it may have gone through anyway.'); await refresh(); return; }
  $('tTitle').value=''; $('tBody').value=''; $('tDue').value='';
  $('tPrev').innerHTML='';
  say('ok','Assignment sent. It appears on their phone next time they open the app.');
  await refresh();
}

/* ---------------- actions ---------------- */
async function sendWords(){
  const items = parseLines($('wIn').value);
  if(!items.length){ say('err','Add at least one line: word | meaning | example sentence'); return; }
  say('busy','Sending '+items.length+' words…');
  const r = await post({action:'assign', student:cur, items:items});
  if(!r.ok){ say('err', r.error||'Failed'); return; }
  $('wIn').value='';
  say('ok', r.added+' words sent. They will appear next time the app is opened.');
  await refresh();
}

async function sendNote(){
  const t = $('nIn').value.trim();
  if(!t){ return; }
  say('busy','Sending note…');
  const r = await post({action:'assign', student:cur, items:[{type:'note', note:t}]});
  if(!r.ok){ say('err', r.error||'Failed'); return; }
  $('nIn').value='';
  say('ok','Note sent.');
  await refresh();
}

async function del(id){
  const a = STATE.assignments.find(x=>String(x.id)===String(id));
  if(!confirm('Remove "'+(a && a.type==='note' ? 'grammar note' : (a?a.w:id))+'" from their app?')) return;
  say('busy','Removing…');
  const r = await post({action:'remove', id:id});
  if(!r.ok){ say('err', r.error||'Failed'); return; }
  say('ok','Removed. It disappears from their device on next open.');
  await refresh();
}

async function edit(id){
  const a = STATE.assignments.find(x=>String(x.id)===String(id));
  if(!a) return;
  const w    = prompt('Word:', a.w);            if(w===null) return;
  const tr   = prompt('Meaning:', a.tr);        if(tr===null) return;
  const ex   = prompt('Example sentence (use ___ for the gap):', a.ex);   if(ex===null) return;
  const exTr = prompt('Translation:', a.exTr);  if(exTr===null) return;
  say('busy','Saving…');
  const r = await post({action:'update', id:id, fields:{w:w, tr:tr, ex:ex, exTr:exTr}});
  if(!r.ok){ say('err', r.error||'Failed'); return; }
  say('ok','Updated.');
  await refresh();
}

/* ---------------- start ---------------- */
if(KEY) boot(); else setupScreen();
</script>
</body>
</html>
